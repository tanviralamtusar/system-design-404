<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>System Design Practice</title>
    <meta name="description" content="Learn system design with animated step-through diagrams, then practise on a live traffic simulator: build designs, push traffic, break things." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      // apply the saved theme before first paint so the page never flashes
      try {
        var t = JSON.parse(localStorage.getItem('sdp:theme'));
        if (!t && window.matchMedia('(prefers-color-scheme: dark)').matches) t = 'dark';
        document.documentElement.dataset.theme = t || 'light';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
